name: Abata Therapeutics
description: Abata Therapeutics was a biotechnology company developing engineered regulatory T cell (Treg)
  therapies aimed at restoring immune tolerance in tissue-specific autoimmune and inflammatory diseases,
  with lead programs directed at progressive multiple sclerosis and type 1 diabetes. Founded in 2021 and
  based in the Boston/Cambridge area (Watertown, Massachusetts), the company was launched by Third Rock
  Ventures and counted Lightspeed Venture Partners among its backers. As a therapeutics developer it
  operated no public developer program, API, or documentation surface. As of this enrichment pass its
  corporate domains (abatatx.com and abatatherapeutics.com) resolve to a WP Engine host but serve an
  unconfigured "Site Not Configured" 404, indicating the public website has been deprovisioned and the
  company appears to have wound down.
